name: Fix pnpm lockfile

on:
  workflow_dispatch:

jobs:
  fix-lockfile:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: rebrand-orpaynter-agent-desktop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push lockfile
        run: |
          git add pnpm-lock.yaml
          git diff --staged --quiet || git commit -m "fix: Update pnpm-lock.yaml to resolve Vercel deployment failures"
          git push
